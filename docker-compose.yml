services:
  v2ray-bot:
    build: .
    image: v2ray-telegram-bot:latest
    ports:
      # Le port hôte se règle via la variable PORT (défaut : 3000, health-check uniquement)
      - "${PORT:-3000}:${PORT:-3000}"
      # Ports V2Ray/VLESS/VMess/Trojan (slots A et B)
      - "10080:10080"
      - "10081:10081"
      - "10082:10082"
      - "10090:10090"
      - "10091:10091"
      - "10092:10092"
    environment:
      - PORT=${PORT:-3000}
      - APP_URL=${APP_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
    volumes:
      # Persiste le binaire V2Ray téléchargé (évite de le re-télécharger à chaque redémarrage du conteneur)
      - v2ray_bin:/app/bin
    restart: unless-stopped

volumes:
  v2ray_bin:
